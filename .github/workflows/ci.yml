name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20's test runner can crash while parsing non-ASCII child stdout
          # (nodejs/node#64061); the fix first shipped in the 24.x line.
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Build client
        run: npm run build

      - name: Run server tests
        run: npm --prefix server test

      - name: Run CLI tests
        run: npm run test:cli

      - name: Smoke test CLI help
        run: npm run cli -- --help

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: |
          npm run dev &
          npx wait-on http://localhost:5173 http://localhost:5000/api/health --timeout 120000
          npm --prefix client exec playwright test